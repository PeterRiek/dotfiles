# Noctalia v5 config, ported from the old v4 settings.json.
# Declarative base layer. GUI changes land in ~/.local/state/noctalia/settings.toml
# and override anything here.

[shell]
font_family = "Adwaita Sans"
avatar_path = "/home/peter/Pictures/Profile/pb.png"

[shell.shadow]
direction = "down_right"

# v4 appLauncher: viewMode "grid", position center, search bar at top.
# v5 defaults to list view + search bar at bottom, so restore the v4 feel.
[shell.launcher]
app_grid        = true
search_position = "top"

# Launcher floats centered on screen; other panels stay attached to the bar.
[shell.panel]
launcher_placement       = "floating"
launcher_position        = "center"
clipboard_placement      = "attached"
control_center_placement = "attached"
wallpaper_placement      = "attached"
session_placement        = "attached"

# ── Theme ──
# v4 predefinedScheme was "Gruvvy" (not a v5 builtin). Mapped to builtin Gruvbox.
# If "Gruvvy" was a community palette, set: source = "community", community_palette = "Gruvvy"
[theme]
mode    = "dark"
source  = "builtin"
builtin = "Gruvbox"

# v4 templates.activeTemplates: alacritty, niri, kitty (enableUserTheming was off)
[theme.templates]
enable_builtin_templates = true
builtin_ids = ["alacritty", "niri", "kitty"]

# ── Wallpaper ──
[wallpaper]
enabled   = true
fill_mode = "crop"
directory = "/home/peter/Pictures/Wallpapers/Gruvbox"

# ── Bar ── (v4: floating, 0.93 opacity, rounded, capsules on)
[bar.main]
position           = "top"
background_opacity = 0.93
radius             = 12
margin_ends        = 4
margin_edge        = 4
capsule            = true

start  = ["launcher", "clock", "cpu", "active_window", "media"]
center = ["workspaces"]
end    = ["tray", "network", "notifications", "battery", "volume", "brightness", "control-center"]

# Just CPU usage — dropped cpu-temp and ram widgets for a compact bar.
[widget.cpu]
type = "sysmon"
stat = "cpu_usage"

# NOTE: the Tailscale bar widget was dropped. v5 plugins must be re-enabled in
# Settings → Plugins first; once Tailscale is loaded, add its widget to the bar
# via Settings → Bar → Widgets (it self-registers the correct id there).

# v4 MediaMini capped at maxWidth 145; v5 default 220 overflows into workspaces.
[widget.media]
max_length = 145

[widget.clock]
format          = "{:%H:%M %a, %b %d}"
vertical_format = "{:%H\n%M}"
tooltip_format  = "{:%H:%M %a, %b %d}"

# ── Dock ── (v4 had it enabled, floating, auto-hide, bottom)
[dock]
enabled       = true
position      = "bottom"
auto_hide     = true
# don't reserve an exclusion zone while hidden — that left a dead gap at the bottom
reserve_space = false

# ── Location / Weather ── (v4 location name "Munich", weather on, celsius)
[location]
auto_locate = false
address     = "Munich"

[weather]
enabled         = true
unit            = "celsius"
effects         = true

# ── OSD / Notifications ──
[osd]
hide_delay_ms      = 2000
background_opacity = 1.0

[notification]
background_opacity = 1.0

# ── Idle ── (v4: screen off 600s, lock 660s, suspend 1800s)
[idle.behavior.screen-off]
timeout = 600
action  = "screen_off"
enabled = true

[idle.behavior.lock]
timeout = 660
action  = "lock"
enabled = true

[idle.behavior.suspend]
timeout = 1800
action  = "suspend"
enabled = true

# ── Control Center shortcuts ── (ported from v4; PowerProfile/KeepAwake/
# NoctaliaPerformance have no v5 shortcut type, so they're dropped)
[[control_center.shortcuts]]
type = "wifi"
[[control_center.shortcuts]]
type = "bluetooth"
[[control_center.shortcuts]]
type = "wallpaper"
[[control_center.shortcuts]]
type = "notification"
[[control_center.shortcuts]]
type = "nightlight"
[[control_center.shortcuts]]
type = "session"
